# Mid-scale validation run: exercises every stage with enough data to be
# informative, but finishes in minutes rather than hours.
_base_: base.yaml

experiment:
  name: medium
  out_dir: results/medium

data:
  max_train_episodes: 80
  max_val_episodes: 16

train:
  epochs: 5
  max_batches_per_epoch: 60
  val_batches: 10

models:
  predictive: [persistence, ar, linear, mlp, transformer, obsspace, wm_rssm, wm_jepa, wm_transformer]

eval:
  n_samples: 2000
  horizons: [1, 3, 6]
  splits: [test_iid, ood_liquidity_crisis, ood_unseen_agents, ood_novel_mechanism]

counterfactual:
  scenarios: [iid, liquidity_crisis]
  n_episodes: 2
  n_probes: 5

control:
  scenarios: [iid, liquidity_crisis]
  n_episodes: 2
  steps: 96
  policies: [noop, random, buy_and_hold, llm, planner_no_model, wm_greedy, wm_plan, unified, oracle_plan]
